# PS cycles. Injections are PSB cycles; bp_offset is relative to the PS cycle start.

- id: AD
  name: "AD"
  length_bp: 2
  user: AD
  colour: "#800080"
  beam: {destination: AD}
  injections:
    - {cycle: PSB.AD, bp_offset: -1}

