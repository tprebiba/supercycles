# SPS cycles. Injections are PS cycles; bp_offset is relative to the SPS cycle start.
# average_power_MW: average magnet power of the cycle (values from the old database).
# profile: magnet current file in supercycles/data/profiles/.

- id: SFTPRO
  name: "SFTPRO"
  length_bp: 9
  user: SFTPRO1
  colour: "#8B0000"
  average_power_MW: 52.83
